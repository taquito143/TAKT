<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<title>Estudio de Bolsillo</title>
<style>
:root{--bg:#0d0e12;--panel:#16181f;--panel2:#1f222c;--line:#2a2e3a;--text:#e8e9ee;--dim:#8a8fa0;
--kick:#ff5a4f;--snare:#ffb23f;--clap:#f6e05e;--hat:#5ee1a1;--ohat:#3fc8ff;--tom:#b38bff;--bass:#ff7a3d;--synth:#4fd1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;touch-action:manipulation;cursor:pointer}
header{padding:10px 12px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.r1{display:flex;align-items:center;gap:8px}
.brand{font-weight:800;letter-spacing:.3px;font-size:15px;white-space:nowrap}.brand b{color:var(--bass)}
#scope{flex:1;height:30px;min-width:30px;display:block}
#chain{height:34px;padding:0 10px;font-size:12px;white-space:nowrap}#chain.on{background:var(--bass);color:#111;border-color:var(--bass)}
#menuBtn{width:40px;height:34px;font-size:18px}
.r2{display:flex;align-items:center;gap:8px;margin-top:8px}
#play{width:48px;height:48px;border-radius:50%;background:var(--bass);border:none;color:#111;font-size:20px;flex:none}
#play.on{background:#fff}
.bpm{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;height:44px;flex:none}
.bpm button{width:34px;height:42px;border:none;background:none;font-size:20px}
.bpm div{min-width:40px;text-align:center;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}.bpm small{display:block;font-size:9px;color:var(--dim);font-weight:400;margin-top:2px}
.slots{display:flex;gap:5px;margin-left:auto}
.slot{width:34px;height:44px;font-weight:700;position:relative;padding:0}
.slot.on{background:var(--text);color:#111}
.slot.has::after{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--bass)}
.slot.playing{outline:2px solid var(--bass);outline-offset:1px}
main{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);flex:none}
nav button{flex:1;border:none;border-radius:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--dim)}
nav button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--text)}nav button.on i{filter:none;opacity:1}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.chip{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;text-align:left}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel2))}
.led{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,#000);flex:none;transition:background .1s,box-shadow .1s}
.led.hit{background:var(--c);box-shadow:0 0 8px var(--c);transition:none}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto}
.pad{aspect-ratio:1;border-radius:14px;position:relative;font-size:11px;color:var(--dim);padding:0}
.pad span{position:absolute;top:6px;left:8px}
.pad.beat{border-color:#454b5e}
.pad.v1{background:color-mix(in srgb,var(--c) 50%,#000);border-color:var(--c);color:#fff}
.pad.v2{background:var(--c);border-color:#fff;color:#111}
.pad.v2::after{content:'ACENTO';position:absolute;bottom:6px;left:0;right:0;font-size:8px;letter-spacing:1px;font-weight:700}
.pad.now{box-shadow:0 0 0 3px #fff inset}
.hint{font-size:12px;color:var(--dim);text-align:center;margin:10px 0 0}
.ov{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.ovrow{display:grid;grid-template-columns:44px repeat(16,1fr);gap:2px;align-items:center;margin:3px 0}
.ovrow span{font-size:10px;color:var(--dim)}
.ovrow i{height:20px;border-radius:3px;background:var(--panel2)}
.ovrow i.b{background:#2a2e3b}
.ovrow i.v1{background:color-mix(in srgb,var(--c) 60%,#000)}.ovrow i.v2{background:var(--c)}
.ovrow i.now{outline:1px solid #fff}
.pager{display:flex;gap:6px;margin-bottom:8px}.pager button{flex:1;height:36px;font-size:13px}.pager button.on{background:var(--text);color:#111}
.grid{display:grid;grid-template-columns:34px repeat(8,1fr);gap:3px}
.lbl{font-size:11px;color:var(--dim);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.lbl.root{color:var(--text);font-weight:700}.lbl sub{font-size:8px;margin-left:1px}
.cell{height:28px;border-radius:5px;padding:0;background:var(--panel2);border:none}
.cell.root{background:#262a37}.cell.beat{box-shadow:inset 2px 0 0 #3a3f50}
.bass .cell.on{background:var(--bass)}.synth .cell.on{background:var(--synth)}
.cell.now{box-shadow:inset 0 0 0 2px #ffffff90}
.num{text-align:center;font-size:10px;color:var(--dim);padding:2px 0}.num.now{color:#fff;font-weight:800}
.flags{margin-top:6px}.flag{height:30px;padding:0;font-size:12px;color:var(--dim)}.flag.on{background:var(--bass);color:#111;border-color:var(--bass)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.card h3{margin:0 0 4px;font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.card h3 button{text-transform:none;letter-spacing:0;height:30px;padding:0 12px;font-size:12px}
.card h3 button.on{background:#ff5a4f;color:#111;border-color:#ff5a4f}
.sl,.seg{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;margin:8px 0;font-size:13px}
input[type=range]{width:100%;accent-color:var(--bass);height:30px;margin:0}
.seg>div{display:flex;gap:4px}.seg button{flex:1;height:34px;font-size:12px;padding:0}.seg button.on{background:var(--text);color:#111}
select{height:36px;padding:0 8px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools{display:flex;gap:8px;margin-top:14px}.tools button{flex:1;height:44px;font-size:13px}
#sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:10}
#sheet.hide{display:none}
.sheet-in{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-in h2{margin:0 0 10px;font-size:16px}.sheet-in p{color:var(--dim);font-size:13px;margin:6px 0 12px}
.sheet-in .big{display:block;width:100%;height:48px;margin:6px 0;text-align:left;padding:0 14px;font-size:14px}
.sheet-in .big.danger{color:#ff7b72}
.sheet-in .row{display:flex;gap:6px;margin:8px 0}.sheet-in .row button{flex:1;height:44px}.sheet-in .row button.on{background:var(--text);color:#111}
.sheet-in .go{background:var(--bass);color:#111;border:none;font-weight:700;width:100%;height:48px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="r1">
    <div class="brand">Estudio<b>·</b>Bolsillo</div>
    <canvas id="scope"></canvas>
    <button id="chain" title="Encadenar patrones">🔗 Cadena</button>
    <button id="menuBtn" aria-label="Menú">⋯</button>
  </div>
  <div class="r2">
    <button id="play" aria-label="Reproducir">▶</button>
    <div class="bpm"><button id="bpmDn">−</button><div><span id="bpmV">120</span><small>BPM</small></div><button id="bpmUp">+</button></div>
    <div class="slots" id="slots"></div>
  </div>
</header>
<main id="main"></main>
<nav>
  <button data-tab="drums"><i>🥁</i>Ritmo</button>
  <button data-tab="bass"><i>🎸</i>Bajo</button>
  <button data-tab="synth"><i>🎹</i>Synth</button>
  <button data-tab="mix"><i>🎚️</i>Mezcla</button>
</nav>
<div id="sheet" class="hide"><div class="sheet-in" id="sheetIn"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
"use strict";
const $=s=>document.querySelector(s);
const NOTE_NAMES=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const SCALES={'Menor':[0,2,3,5,7,8,10],'Mayor':[0,2,4,5,7,9,11],'Pentatónica':[0,3,5,7,10],'Dórica':[0,2,3,5,7,9,10],'Frigia':[0,1,3,5,7,8,10],'Blues':[0,3,5,6,7,10]};
const DRUMS=[{id:'kick',name:'Bombo'},{id:'snare',name:'Caja'},{id:'clap',name:'Palmas'},{id:'hat',name:'Hat'},{id:'ohat',name:'Hat abierto'},{id:'tom',name:'Tom'}];
const CH=['drums','bass','synth'], CH_NAME={drums:'Ritmo',bass:'Bajo',synth:'Synth'};
const ROWS=12, KEY='estudio-bolsillo-v1';

/* ---------- estado ---------- */
function emptyPattern(){const d={};DRUMS.forEach(x=>d[x.id]=Array(16).fill(0));
  return {drums:d,bass:Array.from({length:16},()=>({n:-1,a:0,s:0})),synth:Array.from({length:16},()=>[])};}
function defaultState(){
  const s={v:1,bpm:122,swing:0.08,root:9,scale:'Menor',cur:0,chain:false,
    bassP:{wave:'saw',cut:0.3,res:0.65,env:0.55,dec:0.3,drive:0.25,oct:0},
    synP:{wave:'saw',att:0.01,rel:0.5,cut:0.5,det:0.35,len:3,oct:0},
    mix:{drums:{v:0.9,m:0,d:0,r:0.08},bass:{v:0.8,m:0,d:0.08,r:0},synth:{v:0.55,m:0,d:0.35,r:0.35},dSteps:3,dFb:0.4,rev:0.6,master:0.85},
    patterns:[emptyPattern(),emptyPattern(),emptyPattern(),emptyPattern()]};
  const P=s.patterns[0],D=P.drums;
  [0,4,8,12].forEach(i=>D.kick[i]=i===0?2:1);[4,12].forEach(i=>D.clap[i]=1);
  [2,6,10,14].forEach(i=>D.hat[i]=2);[1,5,9,13,15].forEach(i=>D.hat[i]=1);D.ohat[14]=1;D.hat[14]=0;D.tom[15]=1;
  [[0,0,1,0],[2,0,0,0],[3,7,1,0],[6,0,0,1],[7,2,0,0],[10,0,0,0],[11,4,1,0],[13,3,0,1],[14,2,0,0]].forEach(([i,n,a,sl])=>P.bass[i]={n,a,s:sl});
  P.synth[0]=[7,9,11];P.synth[6]=[7,9,11];P.synth[10]=[5,7,9];
  return s;
}
function merge(base,o){for(const k in o){if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])&&base[k]&&typeof base[k]==='object')merge(base[k],o[k]);else base[k]=o[k];}return base;}
function load(){try{const t=localStorage.getItem(KEY);if(!t)return null;const o=JSON.parse(t);if(!o||!Array.isArray(o.patterns)||o.patterns.length!==4)return null;return merge(defaultState(),o);}catch(e){return null;}}
let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}},300);}
let state=load()||defaultState();
let tab='drums',selDrum='kick',bassPage=0,synPage=0;

const pat=()=>state.patterns[state.cur];
const scale=()=>SCALES[state.scale]||SCALES.Menor;
const stepDur=()=>60/state.bpm/4;
const rootOff=()=>state.root-(state.root>6?12:0);
const bassBase=()=>36+rootOff()+12*state.bassP.oct;
const synBase=()=>60+rootOff()+12*state.synP.oct;
function rowMidi(base,r){const sc=scale();return base+sc[r%sc.length]+12*Math.floor(r/sc.length);}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function isEmpty(P){return !DRUMS.some(d=>P.drums[d.id].some(v=>v))&&!P.bass.some(b=>b.n>=0)&&!P.synth.some(c=>c.length);}
function chainOrder(){const o=[];state.patterns.forEach((p,i)=>{if(!isEmpty(p))o.push(i);});return o.length?o:[state.cur];}
function getPath(p){return p.split('.').reduce((o,k)=>o[k],state);}
function setPath(p,v){const ks=p.split('.');const last=ks.pop();ks.reduce((o,k)=>o[k],state)[last]=v;}

/* ---------- audio ---------- */
let ctx=null,G=null;
const noiseCache=new WeakMap();
function noise(c){let b=noiseCache.get(c);if(!b){b=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noiseCache.set(c,b);}return b;}
function impulse(c,sec){const len=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}return b;}
function buildGraph(c,live){
  const master=c.createGain(),comp=c.createDynamicsCompressor();
  comp.threshold.value=-12;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.2;comp.knee.value=6;
  master.connect(comp);let an=null;
  if(live){an=c.createAnalyser();an.fftSize=512;comp.connect(an);an.connect(c.destination);}else comp.connect(c.destination);
  const dIn=c.createGain(),delay=c.createDelay(2),fb=c.createGain(),dlf=c.createBiquadFilter();
  dlf.type='lowpass';dlf.frequency.value=3200;dIn.connect(delay);delay.connect(dlf);dlf.connect(fb);fb.connect(delay);dlf.connect(master);
  const rIn=c.createGain(),conv=c.createConvolver(),rOut=c.createGain();conv.buffer=impulse(c,2.4);rIn.connect(conv);conv.connect(rOut);rOut.connect(master);
  const ch={};
  for(const k of CH){const g=c.createGain(),ds=c.createGain(),rs=c.createGain();g.connect(master);g.connect(ds);ds.connect(dIn);g.connect(rs);rs.connect(rIn);ch[k]={g,ds,rs};}
  const gr={c,live,master,an,delay,fb,rOut,ch,ohat:null};applyMix(gr);return gr;
}
function applyMix(gr){if(!gr)return;const m=state.mix,c=gr.c,t=c.currentTime;
  const S=(p,v)=>{if(gr.live)p.setTargetAtTime(v,t,0.03);else p.value=v;};
  for(const k of CH){const x=m[k];S(gr.ch[k].g.gain,x.m?0:x.v);S(gr.ch[k].ds.gain,x.d);S(gr.ch[k].rs.gain,x.r);}
  S(gr.delay.delayTime,Math.min(1.9,stepDur()*m.dSteps));S(gr.fb.gain,m.dFb);S(gr.rOut.gain,m.rev*1.2);S(gr.master.gain,m.master);}
function env(g,t,peak,dec){g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dec);}
function noiseSrc(gr,t,dur){const n=gr.c.createBufferSource();n.buffer=noise(gr.c);n.start(t,Math.random()*0.4);n.stop(t+dur);return n;}
function filt(c,type,f,q){const x=c.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x;}
const VOICES={
  kick(gr,t,v){const c=gr.c,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(44,t+0.12);env(g,t,v*1.1,0.5);o.connect(g);g.connect(gr.ch.drums.g);o.start(t);o.stop(t+0.55);
    const n=noiseSrc(gr,t,0.03),f=filt(c,'highpass',2500),ng=c.createGain();env(ng,t,v*0.25,0.015);n.connect(f);f.connect(ng);ng.connect(gr.ch.drums.g);},
  snare(gr,t,v){const c=gr.c,n=noiseSrc(gr,t,0.25),f=filt(c,'highpass',1200),g=c.createGain();env(g,t,v*0.6,0.19);n.connect(f);f.connect(g);g.connect(gr.ch.drums.g);
    const o=c.createOscillator(),og=c.createGain();o.type='triangle';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(160,t+0.08);env(og,t,v*0.5,0.1);o.connect(og);og.connect(gr.ch.drums.g);o.start(t);o.stop(t+0.12);},
  clap(gr,t,v){const c=gr.c,n=noiseSrc(gr,t,0.3),f=filt(c,'bandpass',1400,1.1),g=c.createGain();g.gain.setValueAtTime(0,t);
    for(let k=0;k<3;k++){const s=t+k*0.011;g.gain.setValueAtTime(v*0.9,s);g.gain.exponentialRampToValueAtTime(0.06,s+0.009);}
    g.gain.setValueAtTime(v*0.9,t+0.034);g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);n.connect(f);f.connect(g);g.connect(gr.ch.drums.g);},
  hat(gr,t,v){const c=gr.c;if(gr.ohat&&gr.ohatEnd>t){try{gr.ohat.gain.cancelScheduledValues(t);gr.ohat.gain.setTargetAtTime(0,t,0.006);}catch(e){}gr.ohat=null;}
    const n=noiseSrc(gr,t,0.08),f=filt(c,'highpass',7500),g=c.createGain();env(g,t,v*0.32,0.05);n.connect(f);f.connect(g);g.connect(gr.ch.drums.g);},
  ohat(gr,t,v){const c=gr.c,n=noiseSrc(gr,t,0.45),f=filt(c,'highpass',7000),g=c.createGain();env(g,t,v*0.28,0.38);n.connect(f);f.connect(g);g.connect(gr.ch.drums.g);gr.ohat=g;gr.ohatEnd=t+0.4;},
  tom(gr,t,v){const c=gr.c,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(230,t);o.frequency.exponentialRampToValueAtTime(115,t+0.25);env(g,t,v*0.7,0.35);o.connect(g);g.connect(gr.ch.drums.g);o.start(t);o.stop(t+0.4);}
};
const curveCache={};
function curve(d){const k=Math.round(d*20);if(curveCache[k])return curveCache[k];const n=1024,a=new Float32Array(n),amt=k*1.5+0.001;
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;a[i]=(1+amt)*x/(1+amt*Math.abs(x));}return curveCache[k]=a;}
function vBass(gr,seq,end,acc){
  const c=gr.c,p=state.bassP,base=bassBase(),t0=seq[0].t,f=n=>mtof(rowMidi(base,n));
  const o=c.createOscillator();o.type=p.wave==='sq'?'square':'sawtooth';o.frequency.setValueAtTime(f(seq[0].n),t0);
  for(let i=1;i<seq.length;i++){o.frequency.setValueAtTime(f(seq[i-1].n),Math.max(t0,seq[i].t-0.05));o.frequency.exponentialRampToValueAtTime(f(seq[i].n),seq[i].t);}
  const fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=0.7+p.res*16+(acc?3:0);
  const cb=60+p.cut*p.cut*3200,ea=p.env*p.env*6000*(acc?1.6:1)+100;
  fl.frequency.setValueAtTime(Math.min(cb+ea,18000),t0);fl.frequency.setTargetAtTime(cb,t0+0.003,0.02+p.dec*0.5);
  const sh=c.createWaveShaper();sh.curve=curve(p.drive);sh.oversample='2x';
  const g=c.createGain(),lvl=(acc?0.95:0.65)/(1+p.drive*1.2);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(lvl,t0+0.004);g.gain.setValueAtTime(lvl,end);g.gain.linearRampToValueAtTime(0,end+0.02);
  o.connect(fl);fl.connect(sh);sh.connect(g);g.connect(gr.ch.bass.g);o.start(t0);o.stop(end+0.05);
}
function vSynth(gr,t,row,dur){
  const c=gr.c,p=state.synP,fr=mtof(rowMidi(synBase(),row)),type=p.wave==='sq'?'square':p.wave==='tri'?'triangle':'sawtooth';
  const fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=2;const cb=200+p.cut*p.cut*8000;
  fl.frequency.setValueAtTime(Math.min(cb*2.2,18000),t);fl.frequency.setTargetAtTime(cb,t,0.15);
  const g=c.createGain(),pk=0.15,hold=t+Math.max(dur,p.att+0.005);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+p.att);g.gain.setValueAtTime(pk,hold);g.gain.exponentialRampToValueAtTime(0.0001,hold+p.rel);

function scheduleStep(gr,pi,step,barStart,sd,live){

  const B=P.bass,b=B[step];
  if(b.n>=0&&!(step>0&&B[step-1].s&&B[step-1].n>=0)){
    const seq=[{n:b.n,t}];let k=step;
    while(k<15&&B[k].s&&B[k+1].n>=0){k++;seq.push({n:B[k].n,t:tOf(k)});}
    vBass(gr,seq,tOf(k)+sd*(B[k].s?0.95:0.5),b.a);

/* ---------- transporte ---------- */
let playing=false,timer=0,step=0,barStart=0,playPat=0,queue=[],shownPat=-1,lastNow=-1;

function tick(){const sd=stepDur();while(barStart+step*sd<ctx.currentTime+0.12){scheduleStep(G,playPat,step,barStart,sd,true);step++;if(step>=16){step=0;barStart+=16*sd;playPat=nextPat();}}}

  playing=true;step=0;barStart=ctx.currentTime+0.06;
  if(state.chain){const o=chainOrder();playPat=o.includes(state.cur)?state.cur:o[0];}else playPat=state.cur;
  queue=[];tick();timer=setInterval(tick,25);renderHeader();}
function stop(){playing=false;clearInterval(timer);queue=[];shownPat=-1;clearNow();renderHeader();}
function setBpm(v){v=Math.max(60,Math.min(200,Math.round(v)));if(v===state.bpm)return;state.bpm=v;
  if(playing){const sd=stepDur();barStart=ctx.currentTime+0.02-step*sd;}
  applyMix(G);$('#bpmV').textContent=v;save();}

function loop(){
  requestAnimationFrame(loop);

    if(cur){
      if(cur.pat!==shownPat){shownPat=cur.pat;if(state.chain&&state.cur!==cur.pat){state.cur=cur.pat;render();}else renderHeader();}
      if(cur.pat===state.cur){clearNow();document.querySelectorAll(`[data-col="${cur.s}"]`).forEach(e=>e.classList.add('now'));lastNow=cur.s;}else clearNow();
      if(tab==='drums'){const P=state.patterns[cur.pat];for(const d of DRUMS)if(P.drums[d.id][cur.s]){const l=document.getElementById('led-'+d.id);if(l){l.classList.add('hit');setTimeout(()=>l.classList.remove('hit'),90);}}}
    }}

const scope=$('#scope'),sctx=scope.getContext('2d');let scopeBuf=null;

  if(scope.width!==w*dpr){scope.width=w*dpr;scope.height=h*dpr;}
  sctx.setTransform(dpr,0,0,dpr,0,0);sctx.clearRect(0,0,w,h);sctx.strokeStyle='#ff7a3d';sctx.lineWidth=1.5;sctx.beginPath();
  if(G&&G.an){if(!scopeBuf)scopeBuf=new Uint8Array(G.an.fftSize);G.an.getByteTimeDomainData(scopeBuf);
    for(let i=0;i<scopeBuf.length;i++){const x=i/(scopeBuf.length-1)*w,y=scopeBuf[i]/255*h;i?sctx.lineTo(x,y):sctx.moveTo(x,y);}}
  else{sctx.moveTo(0,h/2);sctx.lineTo(w,h/2);}sctx.stroke();}

/* ---------- generadores ---------- */
const rnd=p=>Math.random()<p,pick=a=>a[Math.floor(Math.random()*a.length)];

  for(let i=0;i<16;i++){if(i%4===0)D.kick[i]=i===0?2:1;else if(rnd(0.1))D.kick[i]=1;}
  if(rnd(0.3)){D.kick[4]=0;D.kick[12]=0;D.kick[pick([6,10,11])]=1;}
  [4,12].forEach(i=>{if(rnd(0.5))D.clap[i]=1;else D.snare[i]=1;if(rnd(0.25))D.snare[i]=D.clap[i]=1;});

  for(let i=0;i<16;i++){const on=mode==='off'?i%4===2:mode==='8'?i%2===0:true;if(on&&!rnd(0.12))D.hat[i]=i%4===2?2:1;}
  if(rnd(0.6)){const i=pick([2,6,10,14]);D.ohat[i]=1;D.hat[i]=0;}
  if(rnd(0.45))D.tom[pick([11,13,14,15])]=1;}
function randBass(P){const deg=[0,0,0,0,7,7,2,4,3,5,1];
  for(let i=0;i<16;i++){P.bass[i]={n:-1,a:0,s:0};if(rnd(i%4===0?0.8:0.45))P.bass[i]={n:Math.min(ROWS-1,pick(deg)),a:rnd(0.25)?1:0,s:rnd(0.16)?1:0};}}
function randSynth(P){P.synth=Array.from({length:16},()=>[]);const starts=pick([[0,8],[0,6,12],[0,3,8,11],[2,6,10,14],[0,10]]);
  const sl=scale().length;for(const s of starts){const r=pick([sl-2,sl-1,sl,sl+1,sl-3]);P.synth[s]=[r,r+2,r+4].filter(x=>x<ROWS&&x>=0);}}

let dlP=null;
function getDL(){if(!dlP)dlP=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve(null);return dlP;}

async function renderOffline(order,loops){
  const sd=stepDur(),sr=44100,sec=order.length*loops*16*sd+2.5;
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new OAC(2,Math.ceil(sec*sr),sr),gr=buildGraph(oc,false);
  let bs=0.02;for(let l=0;l<loops;l++)for(const p of order){for(let s=0;s<16;s++)scheduleStep(gr,p,s,bs,sd,false);bs+=16*sd;}
  return await oc.startRendering();

function encodeWav(buf){const len=buf.length,sr=buf.sampleRate,L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L;
