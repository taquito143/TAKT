.r1{display:flex;align-items:center;gap:8px}

#scope{flex:1;height:30px;min-width:30px;display:block}
#songBtn{height:34px;padding:0 10px;font-size:12px;white-space:nowrap}#songBtn.on{background:var(--bass);color:#111;border-color:var(--bass)}
#menuBtn,#gearBtn{width:36px;height:34px;font-size:18px;padding:0;flex:none}#gearBtn{font-size:17px}
.sheet-in h4{margin:14px 0 2px;font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.ver{color:var(--dim);font-size:11px;text-align:center;margin-top:14px}
#undo,#redo{width:36px;height:34px;font-size:17px;padding:0;flex:none}
button:disabled{opacity:.35;cursor:default}
@media (max-width:430px){#songBtn span{display:none}}
#scope.clip{filter:hue-rotate(-25deg) saturate(3)}
.pad em,.pad b{position:absolute;right:7px;font-style:normal;font-weight:700;font-size:11px}
.pad em{top:5px}.pad b{top:19px;font-size:10px;opacity:.85}
.pad.v0 em,.pad.v0 b{opacity:.45}
.ovrow{grid-template-columns:44px repeat(var(--n),1fr)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin:0 auto 10px}.modes button{height:36px;font-size:12px;padding:0}.modes button.on{background:var(--text);color:#111}
.pad .vb{position:absolute;left:4px;bottom:4px;width:4px;max-height:calc(100% - 8px);border-radius:2px;background:#fff;opacity:.55}
.pad.out{opacity:.25}.pad.sel{outline:2px solid #fff;outline-offset:2px}.ovrow i.out{opacity:.25}
.stepsl{max-width:420px;margin:10px auto 0}
.lpads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
.lpad{aspect-ratio:1;border-radius:16px;background:color-mix(in srgb,var(--c) 30%,var(--panel2));border-color:var(--c);font-weight:700;font-size:14px;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .12s}
.lpad small{font-size:10px;font-weight:400;color:var(--dim)}.lpad.hit{background:var(--c);color:#111;transition:none}.lpad.hit small{color:#111}
.h3b{display:flex;gap:6px}.meter{flex:1;height:6px;margin:0 10px;background:var(--bg);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--hat)}.meter i.hot{background:#ff5a4f}
.fxbox{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}.fxbox .tools{margin-top:6px}
.r2{display:flex;align-items:center;gap:8px;margin-top:8px}
#play{width:48px;height:48px;border-radius:50%;background:var(--bass);border:none;color:#111;font-size:20px;flex:none}
#play.on{background:#fff}
.bpm{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;height:44px;flex:none}
.bpm button{width:34px;height:42px;border:none;background:none;font-size:20px}
.bpm div{min-width:40px;text-align:center;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}.bpm small{display:block;font-size:9px;color:var(--dim);font-weight:400;margin-top:2px}
.slots{display:flex;gap:5px;margin-left:auto}
.slot{width:34px;height:44px;font-weight:700;position:relative;padding:0}
.slot.on{background:var(--text);color:#111}
.slot.has::after{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--bass)}
.slot.playing{outline:2px solid var(--bass);outline-offset:1px}
main{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);flex:none}
nav button{flex:1;border:none;border-radius:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--dim)}
nav button i{display:block;line-height:0;margin-bottom:3px}nav button i .ic{width:22px;height:22px}
nav button.on{color:var(--text)}nav button.on i{color:var(--bass)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.chip{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;text-align:left}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel2))}
.chip{min-width:0;overflow:hidden}.chip .cn{min-width:0;line-height:1.15}
.chip small{display:block;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kitbar,.sndbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kitbar span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;flex:none}
.kitbar select,.sndbar select{flex:1;min-width:0;height:40px}
.sndbar{max-width:420px;margin:0 auto 10px}.sndbar select{border-color:var(--c)}
.sndbar button{width:44px;height:40px;flex:none;padding:0}
.led{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,#000);flex:none;transition:background .1s,box-shadow .1s}
.led.hit{background:var(--c);box-shadow:0 0 8px var(--c);transition:none}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto}
.pad{aspect-ratio:1;border-radius:14px;position:relative;font-size:11px;color:var(--dim);padding:0}
.pad span{position:absolute;top:6px;left:8px}
.pad.beat{border-color:#454b5e}
.pad.v1{background:color-mix(in srgb,var(--c) 50%,#000);border-color:var(--c);color:#fff}
.pad.v2{background:var(--c);border-color:#fff;color:#111}
.pad.v2::after{content:attr(data-acc);position:absolute;bottom:6px;left:0;right:0;font-size:8px;letter-spacing:1px;font-weight:700}
.pad.now{box-shadow:0 0 0 3px #fff inset}
.hint{font-size:12px;color:var(--dim);text-align:center;margin:10px 0 0}
.ov{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.ovrow{display:grid;grid-template-columns:44px repeat(16,1fr);gap:2px;align-items:center;margin:3px 0}
.ovrow span{font-size:10px;color:var(--dim)}
.ovrow i{height:20px;border-radius:3px;background:var(--panel2)}
.ovrow i.b{background:#2a2e3b}
.ovrow i.v1{background:color-mix(in srgb,var(--c) 60%,#000)}.ovrow i.v2{background:var(--c)}
.ovrow i.now{outline:1px solid #fff}

.grid{display:grid;grid-template-columns:34px repeat(8,1fr);gap:3px}
.lbl{font-size:11px;color:var(--dim);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.lbl.root{color:var(--text);font-weight:700}.lbl sub{font-size:8px;margin-left:1px}

.card h3 button.on{background:#ff5a4f;color:#111;border-color:#ff5a4f}
.sl,.seg{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;margin:8px 0;font-size:13px}

select{height:36px;padding:0 8px;width:100%}

#sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:10}
#sheet.hide{display:none}
.sheet-in{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

.tl{background:var(--panel2);border-radius:10px;padding:6px;margin-top:8px}
.tlbars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px}
.tlbars button{height:36px;padding:0;font-size:11px;color:var(--dim);border-radius:6px;background:var(--bg)}
.tlbars button.sel{border-color:var(--voice);color:var(--text);background:color-mix(in srgb,var(--voice) 25%,var(--bg))}
.tlbars button.cur{box-shadow:inset 0 0 0 2px #fff}
.lane{position:relative;height:22px;margin-top:4px}
.tlbars.arr{margin-top:3px}.tlbars.arr button{height:40px;font-size:15px;font-weight:800;color:#111;background:var(--pc);border-color:transparent}
.tlbars.arr button.off{background:var(--bg);color:var(--dim);border-color:var(--line)}
.card h3 button.on2{background:var(--bass);color:#111;border-color:var(--bass)}
.tools button[data-k="sfill"]{font-size:12px;height:38px}
input.txt{width:100%;height:46px;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:0 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;margin:4px 0}
.pjlist{max-height:52vh;overflow-y:auto;margin-bottom:6px}.pjlist .take div{cursor:pointer}.pjlist b{color:var(--bass);font-weight:600;font-size:11px}
.clip{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--voice);color:#111;font-size:10px;font-weight:700;padding:0 5px;overflow:hidden;white-space:nowrap;line-height:22px}
.clip.miss{background:repeating-linear-gradient(45deg,#3a3a44,#3a3a44 4px,#2a2a33 4px,#2a2a33 8px);color:var(--dim)}
.recbtn{display:block;width:100%;height:52px;margin-top:12px;border:none;background:var(--voice);color:#fff;font-weight:700;font-size:15px}
.recbtn.on{background:#fff;color:#c4153a}
.recstate{text-align:center;font-weight:700;color:var(--voice);margin-top:8px;font-size:13px;min-height:18px;font-variant-numeric:tabular-nums}
.take{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.take:first-of-type{border-top:none}
.take div{flex:1;min-width:0}.take small{display:block;color:var(--dim);font-size:11px}
.take button{width:44px;height:40px;flex:none;padding:0}

    S(n.lo.gain,f.lo*12);S(n.mid.gain,f.mid*12);S(n.hi.gain,f.hi*12);
    const ft=f.flt<-0.02?'lowpass':f.flt>0.02?'highpass':'allpass';if(n.fl.type!==ft)n.fl.type=ft;
    if(ft==='lowpass')S(n.fl.frequency,20000*Math.pow(2,f.flt*8));else if(ft==='highpass')S(n.fl.frequency,20*Math.pow(2,f.flt*9));
    if(n.drvK!==f.drv){n.drvK=f.drv;n.drv.curve=f.drv>0.01?driveCurve(f.drv):null;n.drv.oversample=f.drv>0.01?'2x':'none';}S(n.dg.gain,1/(1+f.drv*3));
    if(n.crsK!==f.crs){n.crsK=f.crs;n.crs.curve=f.crs>0.01?crushCurve(f.crs):null;}
    setChorus(gr,n,f.cho);}
  S(gr.delay.delayTime,Math.min(1.9,stepDur()*m.dSteps));S(gr.fb.gain,m.dFb);S(gr.rOut.gain,m.rev*1.2);S(gr.master.gain,m.master);}
function env(g,t,peak,dec){g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dec);}
function noiseSrc(gr,t,dur){const n=gr.c.createBufferSource();n.buffer=noise(gr.c);n.loop=true;n.start(t,Math.random()*0.4);n.stop(t+dur);return n;}
function filt(c,type,f,q){const x=c.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x;}
/* ---------- motores de sonido: cada sonido de la biblioteca es un motor + parámetros ---------- */
const OUT=gr=>gr.ch.drums.g;
function shaper(c,d){const s=c.createWaveShaper();s.curve=curve(d);s.oversample='2x';return s;}
const MET=[205.3,304.4,369.6,522.7,540,800]; // 6 cuadradas desafinadas, estilo hat analógico
const ENG={
  // bombo: seno que cae de f0 a f1, con click de ruido y saturación opcionales
  kick(gr,t,v,p){const c=gr.c,o=c.createOscillator(),g=c.createGain(),end=t+p.dec+0.05;o.type=p.w||'sine';
    o.frequency.setValueAtTime(p.f0,t);o.frequency.exponentialRampToValueAtTime(p.f1,t+p.sw);env(g,t,v*(p.l||1),p.dec);
    let n=o;if(p.dr){const s=shaper(c,p.dr);o.connect(s);n=s;}n.connect(g);g.connect(OUT(gr));o.start(t);o.stop(end);
    if(p.ck){const ns=noiseSrc(gr,t,0.03),f=filt(c,'highpass',p.cf||2500),ng=c.createGain();env(ng,t,v*p.ck,0.015);ns.connect(f);f.connect(ng);ng.connect(OUT(gr));}
    return {g,end};},
  // caja: ruido filtrado + tono opcional
  snare(gr,t,v,p){const c=gr.c,end0=t+p.nd+0.06,ns=noiseSrc(gr,t,p.nd+0.06),f=filt(c,p.nt||'highpass',p.nf,p.nq),g=c.createGain();env(g,t,v*p.nl,p.nd);ns.connect(f);f.connect(g);g.connect(OUT(gr));
    let end=end0;if(p.tl){const o=c.createOscillator(),og=c.createGain();o.type=p.w||'triangle';o.frequency.setValueAtTime(p.tf,t);o.frequency.exponentialRampToValueAtTime(p.tf1||p.tf*0.8,t+0.08);
      env(og,t,v*p.tl,p.td);o.connect(og);og.connect(OUT(gr));o.start(t);o.stop(t+p.td+0.02);end=Math.max(end,t+p.td+0.02);}
    return {g,end};},
  // palmas: n golpecitos de ruido en banda + cola
  clap(gr,t,v,p){const c=gr.c,n=p.n||3,sp=p.sp||0.011,tail=t+sp*n+0.001,end=tail+p.dec+0.04,ns=noiseSrc(gr,t,end-t),f=filt(c,'bandpass',p.f,p.q),g=c.createGain(),L=v*(p.l||1);
    g.gain.setValueAtTime(0,t);for(let k=0;k<n;k++){const s=t+k*sp;g.gain.setValueAtTime(L,s);g.gain.exponentialRampToValueAtTime(0.06,s+sp*0.8);}
    g.gain.setValueAtTime(L,tail);g.gain.exponentialRampToValueAtTime(0.0001,tail+p.dec);ns.connect(f);f.connect(g);g.connect(OUT(gr));return {g,end};},
  // hats y platillos: ruido y/o metal (m = afinación del metal, mix = ruido sumado al metal)
  hat(gr,t,v,p){const c=gr.c,end=t+p.dec*1.3+0.05,g=c.createGain(),f=filt(c,'highpass',p.f);
    if(p.m){const bp=filt(c,'bandpass',p.bp||10000,0.8),mg=c.createGain();mg.gain.value=0.2;
      for(const fr of MET){const o=c.createOscillator();o.type='square';o.frequency.value=fr*p.m;o.connect(mg);o.start(t);o.stop(end);}mg.connect(bp);bp.connect(f);}
    if(!p.m||p.mix){const ns=noiseSrc(gr,t,end-t),ng=c.createGain();ng.gain.value=p.m?p.mix:1;ns.connect(ng);ng.connect(f);}
    f.connect(g);env(g,t,v*(p.l||1),p.dec);g.connect(OUT(gr));return {g,end};},
  // tonal: toms, congas, 808, láseres. a = ataque, lp = filtro, nz = golpe de ruido
  tone(gr,t,v,p){const c=gr.c,o=c.createOscillator(),g=c.createGain(),a=p.a||0,end=t+a+p.dec+0.05,L=v*(p.l||1);o.type=p.w||'sine';
    o.frequency.setValueAtTime(p.f0,t);if(p.f1&&p.f1!==p.f0)o.frequency.exponentialRampToValueAtTime(p.f1,t+(p.sw||p.dec*0.7));
    let n=o;if(p.dr){const s=shaper(c,p.dr);o.connect(s);n=s;}if(p.lp){const f=filt(c,'lowpass',p.lp,p.q||0.7);n.connect(f);n=f;}n.connect(g);
    if(a){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(L,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+p.dec);}else env(g,t,L,p.dec);
    g.connect(OUT(gr));o.start(t);o.stop(end);
    if(p.nz){const ns=noiseSrc(gr,t,0.05),f=filt(c,'bandpass',p.nf||3000,1),ng=c.createGain();env(ng,t,v*p.nz,0.03);ns.connect(f);f.connect(ng);ng.connect(OUT(gr));}
    return {g,end};},
  // campanas: varias ondas fijas por un pasabanda (cencerro, agogó, triángulo, gong)
  bell(gr,t,v,p){const c=gr.c,end=t+p.dec+0.05,g=c.createGain(),f=filt(c,'bandpass',p.bp,p.q||2);
    for(const fr of p.fs){const o=c.createOscillator();o.type=p.w||'square';o.frequency.value=fr;o.connect(f);o.start(t);o.stop(end);}
    f.connect(g);env(g,t,v*(p.l||1),p.dec);g.connect(OUT(gr));return {g,end};},
  // ruido con ataque y barrido de filtro: shakers, subidas, bajadas, viento
  nz(gr,t,v,p){const c=gr.c,a=p.a||0.002,end=t+a+p.dec+0.05,ns=noiseSrc(gr,t,end-t),f=filt(c,p.ft||'bandpass',p.f0,p.q),g=c.createGain(),L=v*(p.l||1);
    if(p.f1){f.frequency.setValueAtTime(p.f0,t);f.frequency.exponentialRampToValueAtTime(p.f1,t+(p.st||a+p.dec));}
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(L,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+p.dec);
    ns.connect(f);f.connect(g);g.connect(OUT(gr));return {g,end};}
};

/* ---------- voz: tomas de micrófono en su propia línea de tiempo ----------
   Las tomas se guardan como Float32 en IndexedDB (localStorage no alcanza para audio);
   el proyecto solo guarda {id, compás, duración, número}. */
const takeBuf=new Map();let recBar=0,rec=null,mic=null;
const IDB={p:null,
  open(){if(!this.p)this.p=new Promise(res=>{try{const r=indexedDB.open('takt',1);r.onupgradeneeded=()=>r.result.createObjectStore('takes');r.onsuccess=()=>res(this.migrate(r.result));r.onerror=()=>res(null);}catch(e){res(null);}});return this.p;},
  async run(mode,fn,isGet){const db=await this.open();if(!db)return null;
    return new Promise(res=>{try{const tx=db.transaction('takes',mode),rq=fn(tx.objectStore('takes'));tx.oncomplete=()=>res(isGet?(rq.result||null):true);tx.onerror=tx.onabort=()=>res(null);}catch(e){res(null);}});},
  // copia una sola vez las tomas de la base vieja 'estudio-bolsillo' (nombre anterior de la app) y la borra
  migrate(db){return new Promise(res=>{if(lsGet('takt-idb')){res(db);return;}const done=()=>{lsSet('takt-idb','1');res(db);},OLD='estudio-bolsillo';
    try{const r=indexedDB.open(OLD);r.onupgradeneeded=()=>r.transaction.abort(); // no existía: no la creamos
      r.onerror=()=>done();
      r.onsuccess=()=>{const old=r.result,fin=ok=>{old.close();if(ok){indexedDB.deleteDatabase(OLD);done();}else res(db);};
        if(!old.objectStoreNames.contains('takes'))return fin(true);
        const items=[],cur=old.transaction('takes').objectStore('takes').openCursor();
        cur.onsuccess=()=>{const c=cur.result;if(c){items.push([c.key,c.value]);c.continue();return;}
          const tx=db.transaction('takes','readwrite'),st=tx.objectStore('takes');for(const [k,v] of items)st.put(v,k);
          tx.oncomplete=()=>fin(true);tx.onerror=tx.onabort=()=>fin(false);};
        cur.onerror=()=>fin(false);};}
    catch(e){done();}});},
  put(k,v){return this.run('readwrite',s=>s.put(v,k));},get(k){return this.run('readonly',s=>s.get(k),true);},del(k){return this.run('readwrite',s=>s.delete(k));}};
function makeBuf(sr,data){const b=new AudioBuffer({length:Math.max(1,data.length),sampleRate:sr,numberOfChannels:1});b.copyToChannel(data,0);return b;}
async function loadTakes(){let n=0;for(const c of state.clips)if(!takeBuf.has(c.id)){const v=await IDB.get(c.id);if(v&&v.data){takeBuf.set(c.id,makeBuf(v.sr,v.data));n++;}}if(n&&tab==='voice')render();}
// agenda las tomas que arrancan en el compás `bar`; con first=true también las que ya venían sonando
function scheduleVoices(gr,bar,t0,bd,first){const end=t0+(state.voice.bars-bar)*bd;
  for(const c of state.clips){const b=takeBuf.get(c.id);if(!b)continue;let off=0;
    if(c.bar===bar)off=0;else if(first&&c.bar<bar&&(c.bar*bd+b.duration)>bar*bd)off=(bar-c.bar)*bd;else continue;
    const s=gr.c.createBufferSource();s.buffer=b;s.connect(gr.ch.voice.g);s.start(t0,off);s.stop(end);
    if(gr.live){(gr.vsrc||(gr.vsrc=[])).push(s);s.onended=()=>{const i=gr.vsrc.indexOf(s);if(i>=0)gr.vsrc.splice(i,1);};}}}
const CAP_SRC="class C extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage({t:currentTime,d:c.slice(0)});return true;}}registerProcessor('cap',C);";
let capReady=null;
async function micOpen(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {code:'none'};
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=ctx.createMediaStreamSource(stream),chunks=[],sink=ctx.createGain();sink.gain.value=0;sink.connect(ctx.destination);let node;
  try{if(!capReady)capReady=ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([CAP_SRC],{type:'application/javascript'})));await capReady;
    node=new AudioWorkletNode(ctx,'cap');node.port.onmessage=e=>chunks.push(e.data);}
  catch(e){capReady=null;const sz=2048;node=ctx.createScriptProcessor(sz,1,1);node.onaudioprocess=e=>chunks.push({t:ctx.currentTime-sz/ctx.sampleRate,d:e.inputBuffer.getChannelData(0).slice(0)});}
  src.connect(node);node.connect(sink);
  const tr=stream.getAudioTracks()[0],st=tr&&tr.getSettings?tr.getSettings():{};
  mic={stream,src,node,sink,chunks,inLat:typeof st.latency==='number'?st.latency:0.01};}
function micClose(){if(!mic)return null;const m=mic;mic=null;try{m.src.disconnect();m.node.disconnect();m.sink.disconnect();}catch(e){}
  if(m.node.port)m.node.port.onmessage=null;else m.node.onaudioprocess=null;m.stream.getTracks().forEach(x=>x.stop());return m;}
function click(at,strong){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=strong?1600:1100;env(g,at,0.35,0.05);o.connect(g);g.connect(G.master);o.start(at);o.stop(at+0.07);}
async function startRec(){ensureAudio();if(playing)stop();
  try{await micOpen();}catch(e){toast(t(e&&e.code==='none'?'t_mic_none':'t_mic_denied'));return;}
  const sd=stepDur(),c0=ctx.currentTime+0.15;for(let b=0;b<4;b++)click(c0+b*4*sd,b===0); // 1 compás de cuenta
  rec={bar:recBar,t0:c0+16*sd,endAt:0};startTransport(rec.t0,recBar);render();}
async function finishRec(){const r=rec;if(!r)return;rec=null;const endT=Math.min(r.endAt||Infinity,ctx.currentTime);stop();const m=micClose();
  if(!m||endT<r.t0+0.25){toast(t('t_too_short'));render();return;}
  // lo que se cantó en el instante T llega con sello T + latencia (salida + entrada + ajuste manual)
  const sr=ctx.sampleRate,lat=(ctx.outputLatency||ctx.baseLatency||0)+m.inLat+state.voice.lat/1000,from=r.t0+lat,N=Math.round((endT-r.t0)*sr),out=new Float32Array(N);
  for(const ch of m.chunks){const i0=Math.round((ch.t-from)*sr);for(let j=0;j<ch.d.length;j++){const k=i0+j;if(k>=0&&k<N)out[k]=ch.d[j];}}

  takeBuf.set(id,makeBuf(sr,out));state.clips.push({id,bar:r.bar,dur:N/sr,n});save();render();
  const ok=await IDB.put(id,{sr,data:out});toast(ok?t('t_take_saved',t('v_take',n)):t('t_nostore'));}

  h+=`<div class="card"><h3>${t('v_takes')}</h3>${state.clips.length?state.clips.map(c=>`<div class="take"><div>${t('v_take',c.n)}<small>${t('v_bar',c.bar+1)} · ${c.dur.toFixed(1)} s${takeBuf.has(c.id)?'':' · '+t('v_noaudio')}${c.bar>=nb?' · '+t('v_outside'):''}</small></div><button data-k="vplay" data-id="${c.id}" aria-label="${t('v_play')}">${ic('play')}</button><button data-k="vdel" data-id="${c.id}" aria-label="${t('v_del')}">${ic('trash')}</button></div>`).join(''):`<p class="hint">${t('v_none')}</p>`}</div>`;
  h+=`<div class="card"><h3>${t('v_sync')}</h3>${sl(t('v_lat'),'voice.lat',-100,300,5)}<p class="hint">${t('v_lat_hint')}</p></div>`;
  return h;}

/* ---------- generadores ---------- */
const rnd=p=>Math.random()<p,pick=a=>a[Math.floor(Math.random()*a.length)];
function randDrums(P){const D=P.drums;DRUMS.forEach(x=>{for(const k of STEPK)P[k][x.id].fill(STEPDEF[k]);P.tl[x.id]=0;});
  for(let i=0;i<16;i++){if(i%4===0)D.kick[i]=i===0?2:1;else if(rnd(0.1))D.kick[i]=1;}
  if(rnd(0.3)){D.kick[4]=0;D.kick[12]=0;D.kick[pick([6,10,11])]=1;}
  [4,12].forEach(i=>{if(rnd(0.5))D.clap[i]=1;else D.snare[i]=1;if(rnd(0.25))D.snare[i]=D.clap[i]=1;});
  if(rnd(0.4))D.snare[pick([7,9,14,15])]=1;
  const mode=pick(['off','8','16']);
  for(let i=0;i<16;i++){const on=mode==='off'?i%4===2:mode==='8'?i%2===0:true;if(on&&!rnd(0.12))D.hat[i]=i%4===2?2:1;}
  if(rnd(0.6)){const i=pick([2,6,10,14]);D.ohat[i]=1;D.hat[i]=0;}
  if(rnd(0.45))D.tom[pick([11,13,14,15])]=1;
  if(rnd(0.4)){const i=pick([3,7,11,15].filter(j=>D.hat[j]));if(i!=null)P.rat.hat[i]=pick([2,3]);} // redoble de hat estilo trap
  if(rnd(0.35))for(const i of [1,5,9,13])if(D.hat[i])P.prob.hat[i]=pick([50,75]);
  if(rnd(0.5))for(let i=1;i<16;i+=2)if(D.hat[i])P.vel.hat[i]=pick([45,60,70]); // hats fantasma
  tile(P,'drums');}
function randBass(P){const deg=[0,0,0,0,7,7,2,4,3,5,1];
  P.bass=P.bass.map(()=>({n:-1,a:0,s:0}));for(let i=0;i<16;i++){if(rnd(i%4===0?0.8:0.45))P.bass[i]={n:Math.min(ROWS-1,pick(deg)),a:rnd(0.25)?1:0,s:rnd(0.16)?1:0};}tile(P,'bass');}
function randSynth(P){P.synth=Array.from({length:NS},()=>[]);const starts=pick([[0,8],[0,6,12],[0,3,8,11],[2,6,10,14],[0,10]]);
  const sl=scale().length;for(const s of starts){const r=pick([sl-2,sl-1,sl,sl+1,sl-3]);P.synth[s]=[r,r+2,r+4].filter(x=>x<ROWS&&x>=0);}tile(P,'synth');}
// copia los primeros 16 pasos a los 16 siguientes (para patrones de 32)
function tile(P,w){const cp=a=>{for(let i=16;i<NS;i++)a[i]=JSON.parse(JSON.stringify(a[i-16]));};
  if(w==='drums'){for(const d of DRUMS)for(const k of STEPK)cp(P[k][d.id]);if(P.len>16&&rnd(0.6)){P.drums.snare[29]=1;P.rat.snare[30]=2;P.drums.snare[30]=1;P.drums.snare[31]=2;}}
  else cp(P[w]);}

/* ---------- plantillas por género ----------

  {id:'dnb',name:'Drum & bass',bpm:172,sw:0,root:4,sc:'Menor',kit:'dnb',
    d:{kick:'X.........x.....',snare:'....X.......X...',hat:'x.x.x.x.x.x.x.x.',tom:'......o.......o.'},
    b:[[0,0,0,0],[10,3,0,0]],y:[[0,[0,2,4]],[8,[5,7,9]]],synP:{len:8,att:0.2,rel:1.5,cut:0.4},bassP:{drive:0.5}},
  {id:'boombap',name:'Boom bap',bpm:90,sw:0.22,root:2,sc:'Menor',kit:'acu',hum:0.3,
    d:{kick:'X.........x.x...',snare:'....x.......x...',hat:'x.x.x.x.x.x.x.x.'},
    b:[[0,0,0,0],[10,0,0,0],[12,3,0,0]],y:[[0,[0,2,4,6]],[8,[3,5,7,9]]],synP:{len:8,att:0.02,rel:1,cut:0.35,wave:'tri'}}];
function fromTemplate(T){const s=defaultState();s.patterns=[emptyPattern(),emptyPattern(),emptyPattern(),emptyPattern()];
  Object.assign(s,{bpm:T.bpm,swing:T.sw,root:T.root,scale:T.sc,hum:T.hum||0});
  const k=KITS.find(k=>k[0]===T.kit);if(k)DRUMS.forEach((d,i)=>s.snd[d.id]=k[2][i]);
  Object.assign(s.mix,T.mix||{});Object.assign(s.synP,T.synP||{});Object.assign(s.bassP,T.bassP||{});
  for(const ch in T.fx||{})Object.assign(s.fx[ch],T.fx[ch]);
  const P=s.patterns[0];
  for(const d of DRUMS){const str=T.d[d.id]||'';for(let i=0;i<16&&i<str.length;i++){const c=str[i];if(c==='.')continue;
    P.drums[d.id][i]=c==='X'?2:1;if(c==='o')P.vel[d.id][i]=60;if(c==='?')P.prob[d.id][i]=50;if('234'.includes(c))P.rat[d.id][i]=+c;}}
  for(const [i,n,a,sl] of T.b||[])P.bass[i]={n,a,s:sl};for(const [i,rows] of T.y||[])P.synth[i]=rows.slice();
  // patrón B: el mismo con un remate de caja al final; el arreglo es A A A B
  const B=s.patterns[1]=JSON.parse(JSON.stringify(P));[12,13,14,15].forEach((i,j)=>{B.drums.snare[i]=j===3?2:1;B.vel.snare[i]=60+j*13;});B.rat.snare[14]=2;
  s.song.seq=Array.from({length:MAXBARS},(_,i)=>i%4===3?1:0);return s;}
function tplSheet(){openSheet(`<h2>${t('tpl_title')}</h2><p>${t('tpl_info')}</p><div class="pjlist">${TPL.map(x=>`<button class="big" data-m="tplGo" data-id="${x.id}">${x.name} <small style="color:var(--dim)">· ${x.bpm} BPM</small></button>`).join('')}</div>`);}

function preview(fn){if(playing)return;ensureAudio();fn(G,ctx.currentTime+0.01);}
$('#main').addEventListener('click',e=>{
  const el=e.target.closest('[data-k]');if(!el)return;const k=el.dataset.k,P=pat(),c=+el.dataset.col,r=+el.dataset.row;
  if(MUT.has(k)&&!(k==='dstep'&&(dmode==='vel'||dmode==='nud')&&P.drums[selDrum][c]))checkpoint();
  if(k==='dsel'){selDrum=el.dataset.id;preview((g,t)=>playDrum(g,selDrum,t,0.9));}
  else if(k==='dstep'){const a=P.drums[selDrum];
    if(dmode==='vel'||dmode==='nud'){selStep=c;if(!a[c])a[c]=1;}
    else if(dmode==='hit')a[c]=(a[c]+1)%3;
    else if(dmode==='rat'){const R=P.rat[selDrum];R[c]=a[c]?R[c]%4+1:Math.max(2,R[c]);if(!a[c])a[c]=1;}
    else{const Q=P.prob[selDrum],o=[100,75,50,25];Q[c]=a[c]?o[(o.indexOf(Q[c])+1)%o.length]:(Q[c]<100?Q[c]:75);if(!a[c])a[c]=1;}
    if(a[c]){const n=P.rat[selDrum][c]||1,v=(a[c]===2?1:0.7)*P.vel[selDrum][c]/100;preview((g,t)=>{for(let j=0;j<n;j++)playDrum(g,selDrum,t+j*stepDur()/n,j?v*0.8:v);});}}
  else if(k==='dmode'){dmode=el.dataset.v;}
  else if(k==='liverec'){liveRec=!liveRec;}
  else if(k==='fxo'){const ch=el.dataset.ch;if(fxOpen.has(ch))fxOpen.delete(ch);else fxOpen.add(ch);}
  else if(k==='fxreset'){state.fx[el.dataset.ch]=fxDefault();applyMix(G);}
  else if(k==='dpage'){drumPage=+el.dataset.v;}
  else if(k==='plen'){P.len=+el.dataset.v;}
  else if(k==='sstep'){const n=SND_LIST.length,i=SND_LIST.findIndex(s=>s.id===state.snd[selDrum]);
    state.snd[selDrum]=SND_LIST[((i<0?0:i)+(+el.dataset.v)+n)%n].id;preview((g,t)=>playDrum(g,selDrum,t,0.9));}
  else if(k==='vbar'){if(!rec)recBar=+el.dataset.v;}
  else if(k==='brush'){brush=+el.dataset.v;}
  else if(k==='sbar'){const i=+el.dataset.v;state.song.seq[i]=state.song.seq[i]===brush&&brush>=0?-1:brush;}
  else if(k==='sfill'){state.song.seq.fill(+el.dataset.v);}
  else if(k==='song'){toggleSong();return;}
  else if(k==='rec'){if(rec)finishRec();else startRec();return;}
  else if(k==='vplay'){const b=takeBuf.get(el.dataset.id);if(b&&!playing&&!rec){ensureAudio();const s=ctx.createBufferSource();s.buffer=b;s.connect(G.ch.voice.g);s.start();}return;}
  else if(k==='vdel'){const cl=state.clips.find(x=>x.id===el.dataset.id);if(cl)openSheet(`<h2>${t('v_del_q',t('v_take',cl.n))}</h2><p>${t('v_del_info')}</p><button class="big danger" data-m="vdelYes" data-id="${cl.id}">${t('v_del_yes')}</button><button class="big" data-m="close">${t('cancel')}</button>`);return;}
  else if(k==='ostep'){const a=P.drums[el.dataset.id];a[c]=a[c]?0:1;}
  else if(k==='basscell'){const b=P.bass[c];if(b.n===r)b.n=-1;else{b.n=r;preview((g,t)=>vBass(g,[{n:r,t}],t+0.22,b.a));}}
  else if(k==='synthcell'){const a=P.synth[c],i=a.indexOf(r);if(i>=0)a.splice(i,1);else{a.push(r);preview((g,t)=>vSynth(g,t,r,0.25));}}
  else if(k==='bflag'){P.bass[c][el.dataset.f]^=1;}
  else if(k==='page'){if(tab==='bass')bassPage=+el.dataset.v;else synPage=+el.dataset.v;}
  else if(k==='set'){let v=el.dataset.v;if(/^-?\d+(\.\d+)?$/.test(v))v=Number(v);setPath(el.dataset.p,v);applyMix(G);}
  else if(k==='mute'){state.mix[el.dataset.ch].m^=1;applyMix(G);}
  else if(k==='rand'){({drums:randDrums,bass:randBass,synth:randSynth})[el.dataset.what](P);}
  else if(k==='clear'){const w=el.dataset.what,E=emptyPattern();P[w]=E[w];if(w==='drums'){for(const x of STEPK)P[x]=E[x];P.tl=E.tl;}}
  save();render();
});

// pads en vivo: suenan al instante y, grabando, se guardan en el paso agendado más cercano a lo que se escuchaba
function liveHit(tr){ensureAudio();const now=ctx.currentTime;playDrum(G,tr,now,0.9);
  const l=document.getElementById('led-'+tr);if(l){l.classList.add('hit');setTimeout(()=>l.classList.remove('hit'),90);}
  if(!(playing&&liveRec))return;const tgt=now-(ctx.outputLatency||ctx.baseLatency||0);let best=null;
  for(const h of hist)if(!best||Math.abs(h.t-tgt)<Math.abs(best.t-tgt))best=h;
  if(!best||Math.abs(best.t-tgt)>stepDur())return;
  const P=state.patterns[best.pat],L=P.tl[tr],s=L?best.a%L:best.s;if(P.drums[tr][s])return;
  checkpoint('live');P.drums[tr][s]=1;save();
  if(best.pat===state.cur){const c=document.querySelector(`.ovrow i[data-id="${tr}"][data-col="${s}"]`);if(c)c.className='v1'+(s%4===0?' b':'');renderHeader();}}

  <button class="big" data-m="open">${ic('upload','lead')}${t('m_open')}</button>
  <button class="big danger" data-m="clearPat">${t('m_clear','ABCD'[state.cur])}</button>
  <button class="big danger" data-m="reset">${t('m_reset')}</button>`));
let exLoops=4;
function exportSheet(){const so=state.song.on,nb=state.voice.bars;
  const secs=Math.round(exLoops*(so?nb*16:pat().len)*stepDur());
  openSheet(`<h2>${t('ex_title')}</h2><p>${so?t('ex_song',nb):t('ex_pat')+' '+'ABCD'[state.cur]}, ${t('ex_rep')}</p>
  <div class="row">${[1,2,4,8].map(n=>`<button data-m="loops" data-v="${n}" class="${n===exLoops?'on':''}">${n}×</button>`).join('')}</div>
  <p>${t('ex_info',secs,qualityLabel())}</p>
  <button class="go" data-m="render">${t('ex_go')}</button>`);}
async function menuAction(m,b){
  if(m==='export')exportSheet();
  else if(m==='loops'){exLoops=+b.dataset.v;exportSheet();}
  else if(m==='render'){openSheet(`<h2>${t('rendering')}</h2><p>${t('wait')}</p>`);
    try{const buf=state.song.on?await renderSong(exLoops):await renderOffline([state.cur],exLoops);const blob=zipStore('pista.wav',new Uint8Array(encodeWav(buf,settings.bits)));closeSheet();await saveFile(`takt-${stamp()}.zip`,blob);}
    catch(e){console.error(e);closeSheet();toast(t('t_export_fail'));}}
  else if(m==='dup'){checkpoint();const n=(state.cur+1)%4;state.patterns[n]=JSON.parse(JSON.stringify(pat()));state.cur=n;closeSheet();save();render();toast(t('t_copied','ABCD'[n]));}
  else if(m==='save'){closeSheet();await saveFile(`takt-${slug(curProj()?curProj().name:'')||'proyecto'}-${stamp()}.json`,JSON.stringify(state));if(state.clips.length)toast(t('t_json_voice'));}
  else if(m==='open'){closeSheet();$('#fileIn').click();}
  else if(m==='clearPat'){checkpoint();state.patterns[state.cur]=emptyPattern();closeSheet();save();render();}
  else if(m==='reset')openSheet(`<h2>${t('reset_q')}</h2><p>${t('reset_info')}</p><button class="big danger" data-m="resetYes">${t('reset_yes')}</button><button class="big" data-m="close">${t('cancel')}</button>`);
  else if(m==='resetYes'){checkpoint();if(rec){rec=null;micClose();}if(playing)stop();state.clips.forEach(c=>IDB.del(c.id));takeBuf.clear();state=defaultState();state.patterns=[emptyPattern(),emptyPattern(),emptyPattern(),emptyPattern()];closeSheet();applyMix(G);save();render();}
  else if(m==='lang'){closeSheet();setLang(b.dataset.v);}
  else if(m==='setLang'){setLang(b.dataset.v);settingsSheet();}
  else if(m==='setQ'){settings[b.dataset.k]=+b.dataset.v;saveSettings();settingsSheet();}
  else if(m==='vdelYes'){const id=b.dataset.id;state.clips=state.clips.filter(c=>c.id!==id);takeBuf.delete(id);IDB.del(id);closeSheet();save();render();}
  else if(m==='close')closeSheet();
  else if(m==='projects')projSheet();
  else if(m==='tpl')tplSheet();
  else if(m==='tplGo'){const T=TPL.find(x=>x.id===b.dataset.id);if(T){addProject(fromTemplate(T),T.name);closeSheet();toast(t('t_tpl',T.name));}}
  else if(m==='pjOpen'){if(b.dataset.id===curId)closeSheet();else{switchProject(b.dataset.id);closeSheet();}}
  else if(m==='pjNew'){const s=defaultState();s.patterns=[emptyPattern(),emptyPattern(),emptyPattern(),emptyPattern()];addProject(s,t('pj_def',projects.length+1));closeSheet();toast(t('t_pj_new'));}
  else if(m==='pjRen'){const p=projects.find(x=>x.id===b.dataset.id);if(!p)return;
    openSheet(`<h2>${t('pj_rename')}</h2><input class="txt" id="pjName" maxlength="40" value="${esc(p.name)}"><button class="go" data-m="pjRenOk" data-id="${p.id}">${t('pj_save')}</button><button class="big" data-m="projects">${t('cancel')}</button>`);
    const inp=$('#pjName');inp.focus();inp.select();inp.addEventListener('keydown',e=>{if(e.key==='Enter')menuAction('pjRenOk',{dataset:{id:p.id}});});}
  else if(m==='pjRenOk'){const p=projects.find(x=>x.id===b.dataset.id),v=($('#pjName')||{}).value;if(p&&v&&v.trim()){p.name=v.trim().slice(0,40);writeIdx();}projSheet();}
  else if(m==='pjDup'){await dupProject(b.dataset.id);projSheet();toast(t('t_pj_dup'));}
  else if(m==='pjDel'){const p=projects.find(x=>x.id===b.dataset.id);if(p)openSheet(`<h2>${t('pj_del_q',esc(p.name))}</h2><p>${t('pj_del_info')}</p><button class="big danger" data-m="pjDelYes" data-id="${p.id}">${t('v_del_yes')}</button><button class="big" data-m="projects">${t('cancel')}</button>`);}
  else if(m==='pjDelYes'){await delProject(b.dataset.id);projSheet();toast(t('t_pj_del'));}
}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const slug=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function projSheet(){const rows=projects.slice().sort((a,b)=>b.upd-a.upd).map(p=>`<div class="take"><div data-m="pjOpen" data-id="${p.id}">${esc(p.name)}${p.id===curId?` <b>· ${t('pj_cur')}</b>`:''}<small>${new Date(p.upd).toLocaleString(L(),{dateStyle:'short',timeStyle:'short'})}</small></div>
  <button data-m="pjRen" data-id="${p.id}" aria-label="${t('pj_rename')}">${ic('pencil')}</button><button data-m="pjDup" data-id="${p.id}" aria-label="${t('pj_dup')}">${ic('copy')}</button><button data-m="pjDel" data-id="${p.id}" aria-label="${t('pj_del')}">${ic('trash')}</button></div>`).join('');
  openSheet(`<h2>${t('pj_title')}</h2><div class="pjlist">${rows}</div><button class="go" data-m="pjNew">${t('pj_new')}</button>`);}
// cambia al proyecto `id`: corta lo que suena, guarda el actual y carga el otro con sus tomas
function switchProject(id){if(rec){rec=null;micClose();}if(playing)stop();flushSave();
  curId=id;lsSet(PJ_CUR,id);state=readProject(id)||defaultState();UNDO.length=0;REDO.length=0;updUndo();takeBuf.clear();
  applyMix(G);render();loadTakes();const p=curProj();if(p)toast(t('t_pj_open',p.name));}
function addProject(s,name){flushSave();const id=newId('p');lsSet(pjKey(id),JSON.stringify(s));projects.push({id,name,upd:Date.now()});writeIdx();switchProject(id);return id;}
// duplicar copia también el audio de las tomas con ids nuevos (si no, borrar una copia borraría el audio de la otra)
async function dupProject(id){flushSave();const s=readProject(id),src=projects.find(x=>x.id===id);if(!s||!src)return;
  for(const c of s.clips){const v=await IDB.get(c.id),nid=newId('v');if(v)await IDB.put(nid,v);c.id=nid;}
  const nid=newId('p');lsSet(pjKey(nid),JSON.stringify(s));projects.push({id:nid,name:t('pj_copy',src.name).slice(0,40),upd:Date.now()});writeIdx();}
async function delProject(id){const s=readProject(id);if(s)for(const c of s.clips)await IDB.del(c.id);
  try{localStorage.removeItem(pjKey(id));}catch(e){}projects=projects.filter(x=>x.id!==id);writeIdx();
  if(id===curId){if(projects.length){const n=projects.slice().sort((a,b)=>b.upd-a.upd)[0];curId='';switchProject(n.id);}
    else{const s2=defaultState();s2.patterns=[emptyPattern(),emptyPattern(),emptyPattern(),emptyPattern()];curId='';addProject(s2,t('pj_def',1));}}}
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const s=parseProject(await f.text());if(!s)throw 0;addProject(s,f.name.replace(/\.json$/i,'').slice(0,40)||t('pj_def',projects.length+1));toast(t('t_opened'));}
  catch(err){toast(t('t_badfile'));}});
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;};
let dlP=null;
function getDL(){if(!dlP)dlP=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve(null);return dlP;}
async function saveFile(name,data){
  const dl=await getDL();
  if(dl){try{await dl.save({filename:name,data});toast(t('t_done'));return;}catch(e){if(e&&e.code==='declined'){toast(t('t_cancelled'));return;}if(e&&e.code==='rate_limited'){toast(t('t_wait'));return;}}}
  try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  catch(e){toast(t('t_nodl'));}
}
async function renderOffline(order,loops){
  const sd=stepDur(),sr=settings.sr,sec=loops*totalSteps(order)*sd+2.5;
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new OAC(2,Math.ceil(sec*sr),sr),gr=buildGraph(oc,false);
  const st=0.02;let g=0;
  for(let l=0;l<loops;l++)for(const p of order){const n=state.patterns[p].len,ps=st+g*sd;
    for(let s=0;s<n;s++){if((g+s)%16===0)scheduleVoices(gr,((g+s)/16)%state.voice.bars,st+(g+s)*sd,16*sd,false);scheduleStep(gr,p,s,ps,sd,false,g+s);}g+=n;}
  return await oc.startRendering();
}
// exporta el arreglo completo (voice.bars compases), `loops` veces
async function renderSong(loops){
  const sd=stepDur(),sr=settings.sr,nb=state.voice.bars,sec=loops*nb*16*sd+2.5;
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new OAC(2,Math.ceil(sec*sr),sr),gr=buildGraph(oc,false);
  for(let l=0;l<loops;l++)for(let b=0;b<nb;b++){const bs=0.02+(l*nb+b)*16*sd;scheduleVoices(gr,b,bs,16*sd,false);for(let i=0;i<16;i++)songStep(gr,b,i,bs+i*sd,sd,false);}
  return await oc.startRendering();
}
// WAV PCM estéreo de 16 o 24 bits (normaliza si el pico pasa de 0,98)
function encodeWav(buf,bits){bits=bits===24?24:16;const B=bits/8,fr=2*B,len=buf.length,sr=buf.sampleRate,L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L;
  let peak=0;for(let i=0;i<len;i++){const a=Math.abs(L[i]),b=Math.abs(R[i]);if(a>peak)peak=a;if(b>peak)peak=b;}const g=peak>0.98?0.98/peak:1;
  const ab=new ArrayBuffer(44+len*fr),v=new DataView(ab),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+len*fr,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*fr,true);v.setUint16(32,fr,true);v.setUint16(34,bits,true);ws(36,'data');v.setUint32(40,len*fr,true);
  const M=bits===24?0x7fffff:0x7fff,put=bits===24?(o,n)=>{v.setUint8(o,n&255);v.setUint8(o+1,(n>>8)&255);v.setUint8(o+2,(n>>16)&255);}:(o,n)=>v.setInt16(o,n,true);
  let o=44;for(let i=0;i<len;i++){for(const C of [L,R]){const x=Math.max(-1,Math.min(1,C[i]*g));put(o,Math.round(x*M));o+=B;}}
  return ab;}
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(name,data){const nm=new TextEncoder().encode(name),crc=crc32(data),d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const L=new DataView(new ArrayBuffer(30));L.setUint32(0,0x04034b50,true);L.setUint16(4,20,true);L.setUint16(10,time,true);L.setUint16(12,date,true);
  L.setUint32(14,crc,true);L.setUint32(18,data.length,true);L.setUint32(22,data.length,true);L.setUint16(26,nm.length,true);
  const C=new DataView(new ArrayBuffer(46));C.setUint32(0,0x02014b50,true);C.setUint16(4,20,true);C.setUint16(6,20,true);C.setUint16(12,time,true);C.setUint16(14,date,true);
  C.setUint32(16,crc,true);C.setUint32(20,data.length,true);C.setUint32(24,data.length,true);C.setUint16(28,nm.length,true);C.setUint32(42,0,true);
  const E=new DataView(new ArrayBuffer(22));E.setUint32(0,0x06054b50,true);E.setUint16(8,1,true);E.setUint16(10,1,true);E.setUint32(12,46+nm.length,true);E.setUint32(16,30+nm.length+data.length,true);
  return new Blob([L,nm,data,C,nm,E]);}
let toastT=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2000);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(rec)finishRec();else if(playing)stop();flushSave();}});
window.addEventListener('pagehide',flushSave);
paintIcons();renderStatic();render();drawScope();loadTakes();if(!lang)langSheet(true);
// la pantalla de carga se va sola después de que se vio el título (la app ya está armada debajo)
setTimeout(()=>{const sp=$('#splash');sp.classList.add('out');setTimeout(()=>sp.remove(),500);},1300);
</script>
